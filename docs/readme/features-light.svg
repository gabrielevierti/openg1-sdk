<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: One API everywhere: The same G1 object runs on the simulator and on real glasses; only the connection line changes.; Emulated firmware: The simulator reproduces arm ordering, reassembly, CRC, heartbeat and MTU, so it catches real mistakes.; Text and bitmaps: Firmware text with wrapping and paging, or 576 × 136 one-bit drawings with a Canvas API.; Every transport: Web Bluetooth, React Native, Capacitor and noble, plus WebSocket and TCP for simulators.; Hub for any language: The whole SDK as a JSON API for Swift, Kotlin, Python, Shortcuts or curl.; Companion app: iPhone and Android app with navigator, teleprompter, notes and mini-apps."><title>Features: One API everywhere: The same G1 object runs on the simulator and on real glasses; only the connection line changes.; Emulated firmware: The simulator reproduces arm ordering, reassembly, CRC, heartbeat and MTU, so it catches real mistakes.; Text and bitmaps: Firmware text with wrapping and paging, or 576 × 136 one-bit drawings with a Canvas API.; Every transport: Web Bluetooth, React Native, Capacitor and noble, plus WebSocket and TCP for simulators.; Hub for any language: The whole SDK as a JSON API for Swift, Kotlin, Python, Shortcuts or curl.; Companion app: iPhone and Android app with navigator, teleprompter, notes and mini-apps.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#0969da;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#afb8c1;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M2 10h3M19 10h3M11 10h2M5 8h6v4a3 3 0 0 1-3 3 3 3 0 0 1-3-3zM13 8h6v4a3 3 0 0 1-3 3 3 3 0 0 1-3-3z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">One API everywhere</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#59636e">The same G1 object runs on the simulator and on</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#59636e">real glasses; only the connection line changes.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Emulated firmware</text><text x="572.0" y="66" class="sans" font-size="13.5" fill="#59636e">The simulator reproduces arm ordering, reassembly,</text><text x="572.0" y="85" class="sans" font-size="13.5" fill="#59636e">CRC, heartbeat and MTU, so it catches real</text><text x="572.0" y="104" class="sans" font-size="13.5" fill="#59636e">mistakes.</text></g><g><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:3.20s"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:3.20s"/><g transform="translate(32.0 179)"><path d="M3 5h18v14H3zM3 16l5-5 4 4 3-3 6 6M15.5 9.5h.01" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Text and bitmaps</text><text x="84.0" y="213" class="sans" font-size="13.5" fill="#59636e">Firmware text with wrapping and paging, or 576 ×</text><text x="84.0" y="232" class="sans" font-size="13.5" fill="#59636e">136 one-bit drawings with a Canvas API.</text></g><g><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:4.80s"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 179)"><path d="M7 7l10 10-5 5V2l5 5L7 17" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Every transport</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#59636e">Web Bluetooth, React Native, Capacitor and noble,</text><text x="572.0" y="232" class="sans" font-size="13.5" fill="#59636e">plus WebSocket and TCP for simulators.</text></g><g><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 307)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Hub for any language</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#59636e">The whole SDK as a JSON API for Swift, Kotlin,</text><text x="84.0" y="360" class="sans" font-size="13.5" fill="#59636e">Python, Shortcuts or curl.</text></g><g><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 307)"><path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zM11 18h2" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Companion app</text><text x="572.0" y="341" class="sans" font-size="13.5" fill="#59636e">iPhone and Android app with navigator,</text><text x="572.0" y="360" class="sans" font-size="13.5" fill="#59636e">teleprompter, notes and mini-apps.</text></g></svg>
